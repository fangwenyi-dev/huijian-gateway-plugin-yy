# ═══════════════════════════════════════════════════════════════════
# 慧尖语音助手 · Ingress 静态页 + 管理 API 反代（宿主 :8001）
# 安全边界（定案）：
#   · /api/endpoints 含 WS token（配对用）——本服务只放行回环与 Supervisor 网段，
#     LAN 设备直连 :8001 拿不到管理面（403）；设备的正路是 :8000 WS（token 可选，
#     契约允许 LAN 免 token）。经 HA 侧边栏 Ingress 进来的是 Supervisor 代理，
#     源地址恒 127.0.0.1 / 172.30.32.0/24（host_network 下所见即此二者）。
#   · 事实文件（status/models_status）无凭据——但当前 server 级白名单
#     对其同样生效（LAN 直连一律 403），"任何来源可读"仅对回环/Supervisor
#     成立。收窄 ACL 前必须先确认目标文件确无凭据；含 token 的
#     endpoints.json 已迁至 /data/run（不在静态根）。
#   · 后台管理 API 绑 127.0.0.1:8002（main.py），仅经此处 /api/ 前缀透出。
# ═══════════════════════════════════════════════════════════════════
worker_processes  1;
pid               /run/nginx-huijian.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;

    server {
        listen 8001 default_server;
        server_name _;

        # 管理面来源白名单（Supervisor ingress 两跳来源恒定；开发机容器内自测走回环）
        # v1.0.48：删除 default docker bridge 全段（172.17/16）放行——那等于宿主
        # 任意容器可读 /api/endpoints（拿真 ws_token）、写 /api/settings、删场景、
        # regenerate token，与本文件头「只放行回环与 Supervisor 网段」的定案直接
        # 矛盾。回环 + 172.30.32.0/24（Supervisor）已覆盖全部正路。
        allow 127.0.0.0/8;
        allow 172.30.32.0/24;
        deny  all;

        root  /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            return 200 '{"ok":true,"who":"nginx"}';
            add_header Content-Type application/json;
        }

        # 管理 API 透传（tts/test 的 wav 内联回包较大，读超时放宽）
        location /api/ {
            proxy_pass http://127.0.0.1:8002/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 180s;
            client_max_body_size 4m;
        }

        location / {
            add_header Cache-Control "no-store";
            try_files $uri $uri/ /index.html;
        }
    }
}
