# 慧尖语音助手 · Supervisor 加载项配置界面中文翻译
# 规则（2026-09-08 定案）：config.yaml schema 每键必有 name（缺一条 Supervisor
# 拒收整份文件）；description 讲清「改了会怎样」。zh-CN 与 zh-Hans 同文兜底。
configuration:
  model_auto_download:
    name: 模型自动下载
    description: >-
      开启后，首次启动自动从网络下载语音模型（约 1.3 GB，STT 双语流式包 + TTS
      多语包；国内镜像优先，三级源自动回退）。下载期间即可试用已就绪的部分。
      关闭后需把解包好的模型目录放入 /data/models/import/ 并重启加载项——完全
      离线环境选这个。
  auto_install_integration:
    name: 自动安装慧尖集成
    description: >-
      开启后每次启动自动把镜像内置的 huijian_ai 集成写入 HA 的 custom_components
      （版本一致时跳过，不覆盖你的其他组件）。首次安装或升级集成后需重启一次
      HA Core 才会加载。关闭则请到 HACS/手动方式自行安装。
  idle_unload_minutes:
    name: 空闲卸载（分钟）
    description: >-
      0=模型常驻内存（默认，响应最快）。填 N>0：连续 N 分钟没有任何识别/合成，
      自动释放 ASR/TTS 模型省内存（树莓派等小内存设备适用），代价是空闲后的
      第一句要多等约 2 秒重新加载。改动即时生效，无需重启。
  log_level:
    name: 日志级别
    description: >-
      info 为日常推荐。排障时改 debug（会打印每条语句的级联决策轨迹），改后
      重启加载项生效；warning/error 用于极端安静环境。
