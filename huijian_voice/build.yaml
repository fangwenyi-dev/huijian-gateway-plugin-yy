# home-assistant/builder 读取本文件决定基镜像（builder@2025.11.0 无 --build-arg
# 参数，且若不声明 build_from 会兜底 Alpine 系 home-assistant/{arch}-base → apt 层炸）。
# 与 Dockerfile 的 ARG BUILD_FROM 默认保持一致（发布一致性测试钉桩防漂移）。
build_from:
  amd64: ghcr.io/hassio-addons/debian-base:7.8.3
  aarch64: ghcr.io/hassio-addons/debian-base:7.8.3
