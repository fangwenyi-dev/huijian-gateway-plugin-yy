name: Build and Release (huijian_voice)

# 与网关仓 ci.yaml 同源范式（v1.7.16 后的九 job 形态）。
# 触发：main 推送（版本号在 config.yaml，改号即发版）；workflow_dispatch 可手跑。
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: huijian-voice

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ========== 0. 代码质量检查（网关同款五门禁） ==========
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts syntax
        run: |
          apt-get update -qq && apt-get install -y -qq shellcheck > /dev/null 2>&1 || true
          for f in huijian_voice/run.sh huijian_voice/boot.sh huijian_voice/nginx.sh huijian_voice/tests/e2e/*.sh; do
            echo "检查 $f ..."
            bash -n "$f" || exit 1
            shellcheck "$f" || echo "⚠ shellcheck 警告（非阻塞）"
          done

      - name: Check YAML files syntax
        run: |
          pip install -q pyyaml
          python3 -c '
          import yaml, sys, glob
          for f in glob.glob("**/*.yaml", recursive=True):
              try:
                  yaml.safe_load(open(f))
                  print(f"OK {f}")
              except Exception as e:
                  print(f"FAIL {f}: {e}")
                  sys.exit(1)
          '

      - name: Check JSON files syntax
        run: |
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            python3 -c "import json; json.load(open('$f'))" || exit 1
            echo "OK $f"
          done

      - name: Python syntax & unit tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libopus0 > /dev/null 2>&1 || true
          pip install -q -r huijian_voice/requirements.txt pytest pyyaml
          python3 -m compileall -q huijian_voice/core huijian_voice/tests
          python3 -m pytest huijian_voice/tests -q

      - name: Verify version consistency (四源)
        run: |
          VERSION=$(grep '^version:' huijian_voice/config.yaml | head -1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "::error title=config.yaml 版本提取失败::'^version:' 行格式漂移？"
            exit 1
          fi
          echo "config.yaml 版本: $VERSION"
          HTML_VER=$(grep 'CURRENT_VERSION = "' huijian_voice/www/index.html | sed 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/')
          echo "index.html 版本: $HTML_VER"
          [ "$VERSION" = "$HTML_VER" ] || { echo "FAIL 版本不一致"; exit 1; }
          python3 - "$VERSION" <<'PYEOF'
          import json, sys
          want = sys.argv[1]
          vj = json.load(open('huijian_voice/www/version.json'))
          mf = json.load(open('huijian_voice/custom_components/huijian_ai/manifest.json'))
          for label, got in [("version.json.addon_version", vj.get("addon_version")),
                             ("version.json.integration_version", vj.get("integration_version")),
                             ("manifest.json.version", mf.get("version"))]:
              status = "OK" if got == want else "FAIL"
              print(f"{status} {label}: {got}")
              if got != want:
                  sys.exit(1)
          PYEOF
          echo "✅ 所有版本号一致: $VERSION"

      - name: nginx config sanity (非阻塞提示)
        run: |
          # 完整语法校验在 e2e job 的真容器里跑（nginx -t 需要镜像内二进制）；
          # 此处仅拦最劣级的花括号失衡
          python3 - <<'PYEOF'
          s = open('huijian_voice/nginx-huijian.conf').read()
          assert s.count('{') == s.count('}'), "nginx conf 花括号失衡"
          print("OK nginx-huijian.conf 括号平衡")
          PYEOF



  # ========== 1. 读取版本号 & 准备变更日志 ==========
  prepare:
    name: Prepare
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        # v1.7.12（审计 I-3）：changelog 兜底路径要 `git log --oneline -10`，
        # 默认 fetch-depth=1 只能给出 1 条——给 20 条历史
        with:
          fetch-depth: 20

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' huijian_voice/config.yaml | head -1 | awk -F'"' '{print $2}')
          # v1.7.12（第 6 轮审计 I-1）：空版本 fail-fast——prepare 是 build/
          # manifest/release 三个下游的版本真源，空串会让镜像 tag 成
          # `:latest`+`:`、Release 名成 "v"，污染仓库不可逆
          if [ -z "$VERSION" ]; then
            echo "::error title=config.yaml 版本提取失败::'^version:' 行缺失或格式漂移"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到版本号: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          # 将 changelog 写入临时文件，避免 echo -e 破坏中文编码（Gitee 乱码根因）
          CHANGELOG_FILE="/tmp/changelog.md"
          
          if [ -f CHANGELOG.md ]; then
            awk -v ver="${{ steps.version.outputs.version }}" '
              /^## \[/{ found=0 }
              $0 ~ "^## \\["ver"]" { found=1; print; next }   # v1.6.26（E-3）：命中行要输出——旧 next 吞掉 "## [x.y.z]" 标题，Release 正文裸开头
              /^## \[/{ if(found) exit }
              found { print }
            ' CHANGELOG.md | head -50 > "$CHANGELOG_FILE"
          fi
          
          if [ ! -s "$CHANGELOG_FILE" ]; then
            # 从 git log 自动生成 changelog（最近 10 条提交）
            {
              echo "## v${{ steps.version.outputs.version }}"
              echo ""
              git log --oneline -10 --format='- %h: %s'
            } > "$CHANGELOG_FILE"
          fi
          
          # 用文件内容设置输出（避免 echo -e 破坏 UTF-8 中文）
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          cat "$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT


  # ========== 2. 构建 Docker 镜像 ==========
  init:
    name: Init
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}


  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, init]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: "huijian_voice"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  # ========== 2.5 真镜像 E2E（发布硬门禁：构建交付镜像本体+真模型+协议断言） ==========
  # 与网关 e2e 同定位：无 continue-on-error——本 job 失败即阻断 manifest/release。
  # 覆盖：Dockerfile/s6/nginx/ModelStore 真下载/三通道协议/版本链/静态根 token
  # 缺席断言/优雅停机。断言脚本与本地 run_local.sh 单一事实源（e2e_client.py）。
  e2e:
    name: E2E real image
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run image E2E
        run: bash huijian_voice/tests/e2e/run_e2e.sh



  manifest:
    name: Manifest
    # e2e 为 v1.6.23 起的硬门禁（详见 e2e job 注释）
    needs: [prepare, init, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest

      # v1.6.4 定案（实验实锤）：GitHub【没有】visibility 变更 API——
      # REST PUT/PATCH × /user/ 与 /users/{owner}/ 全 404、GraphQL 公开
      # schema 无该 mutation（updateV3RegistryPackage 已被移除）。
      # 但 Actions 用 GITHUB_TOKEN 首推的包【继承仓库可见性】：public 仓库
      # ⇒ 新包自动 public（amd64 删包重建实测 anon 200）。历史包因创建时
      # 走了本地 PAT 推送被永久定死 private，修复手段=删包+重推：
      #   gh api -X DELETE /user/packages/container/<pkg>
      # 探测注意：token 必须带 service=ghcr.io 且 manifest GET 要带
      # OCI/idx Accept 头，否则 audience 错 token 会得到误导性 404。
      - name: Check package visibility
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -u
          check_pull() {
            FAILED=""
            for p in "${IMAGE_NAME}" "amd64-${IMAGE_NAME}" "aarch64-${IMAGE_NAME}"; do
              T=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${GITHUB_REPOSITORY_OWNER}/$p:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' || true)
              C=$(curl -s -o /dev/null -w "%{http_code}" \
                   -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
                   "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER}/$p/manifests/${VERSION:-latest}" \
                   -H "Authorization: Bearer ${T:-none}" || echo 000)
              if [ "$C" = "200" ]; then
                echo "✅ ${p} 匿名可拉（public）"
              else
                FAILED="${FAILED} ${p}(HTTP $C)"
              fi
            done
          }
          check_pull
          if [ -n "${FAILED}" ]; then
            # v1.6.9：复测一次再定罪——排除 ghcr 传播延迟/瞬时网络导致的误报
            echo "⏳ 首轮失败，15 秒后复测：${FAILED}"
            sleep 15
            check_pull
          fi
          if [ -n "${FAILED}" ]; then
            # v1.6.9（外部审计确认）：由 ::warning 升级为阻断——config.yaml 已启用
            # image: 路由，包不可匿名拉取时用户安装必失败，绿 CI 是掩盖故障
            echo "::error title=ghcr 包不可匿名拉取::${FAILED} —— image 路线安装会失败。修复：gh api -X DELETE /user/packages/container/<pkg> 删包后重推 CI 自动按仓库 public 重建（详见本文件上方注释）"
            exit 1
          fi



  # ========== 2.6 ACR 国内主源分发（v1.0.1，首装卡下载实发的根治） ==========
  # 定案：客户 image 主源=自有阿里云 ACR 个人版公开仓（上海，国内原生线路，
  # 不再赌透传站边缘缓存运气）。本 job 把 ghcr 上已过 e2e 硬门禁的两架构
  # 仓在 registry 侧合并为【单仓多架构 OCI index】推 ACR（imagetools 远端
  # 合并，零本地转手；ghcr 公开源匿名读，无需 ghcr 登录）。
  # 【硬门禁语义】release 的 needs 含本 job：ACR 推送失败=不发布——因为
  # config.yaml image 已指 ACR，ACR 无此 tag 时发布即全体客户安装失败。
  # 前置 secrets：ACR_USER / ACR_PASS（阿里云访问凭证固定密码，用户在
  # ACR 控制台「访问凭证」设置；凭据只进 Secrets，严禁落仓）。
  push-acr:
    name: Push ACR CN mirror
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACR: crpi-92gcrmsz8v7vvdy1.cn-shanghai.personal.cr.aliyuncs.com
      ACR_REPO: fangwenyi-dev/huijian-gateway-plugin-yy
      VERSION: ${{ needs.prepare.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_PASS }}
      - name: Merge ghcr arch repos into multi-arch index on ACR
        run: |
          set -eu
          for TGT in "$VERSION" latest; do
            docker buildx imagetools create \
              -t "$ACR/$ACR_REPO:$TGT" \
              "ghcr.io/$OWNER/amd64-huijian-voice:$TGT" \
              "ghcr.io/$OWNER/aarch64-huijian-voice:$TGT"
          done
      - name: Self-verify anonymous pull + dual-arch index
        run: |
          set -eu
          # 匿名认证链完全动态发现（不硬编码 realm，防 ACR 端点差异臆造）：
          # /v2/ 401 → WWW-Authenticate 解 realm/service → 匿名 pull token → GET manifest
          HDR=$(curl -sI "$ACR/v2/" | tr -d '\r')
          REALM=$(echo "$HDR" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
          SVC=$(echo "$HDR" | sed -n 's/.*service="\([^"]*\)".*/\1/p')
          [ -n "$REALM" ] || { echo "::error::ACR 未返回 auth realm，认证链异常"; exit 1; }
          T=$(curl -fsS "${REALM}?service=${SVC}&scope=repository:${ACR_REPO}:pull" \
              | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("token") or d.get("access_token",""))')
          [ -n "$T" ] || { echo "::error::匿名 pull token 获取失败——公开读未生效，客户安装必失败"; exit 1; }
          IDX=$(curl -fsS -H "Authorization: Bearer $T" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
              "$ACR/v2/$ACR_REPO/manifests/$VERSION")
          echo "$IDX" | python3 -c '
          import json,sys
          m=json.load(sys.stdin)
          archs={e["platform"]["architecture"] for e in m.get("manifests",[])}
          assert {"amd64","arm64"} <= archs, f"index 缺架构: {archs}"
          print("✅ ACR 匿名可拉，多架构 index 完整:", sorted(archs))'


  # ========== 3. 创建 GitHub Release ==========
  release:
    name: Release
    needs: [prepare, manifest, push-acr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: ${{ needs.prepare.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ========== 4. Gitee Release 自动补发（v1.6.21 起替代手工 POST） ==========
  # 定案背景：Gitee 无 webhook 自动 release，历史做法是发版后手动补最新
  # 一条（"只发最新版"规矩）。此 job 把该人工步骤自动化：body 取
  # CHANGELOG 对应版本段、target_commitish 必带（API 缺省行为不可靠）、
  # 幂等（已存在同 tag 跳过）、401 时给出 BOM/凭据排障提示
  # （.gitee_token 曾带 UTF-8 BOM 致 API 崩，Secret 值必须是纯 ASCII token）。
  gitee-release:
    name: Gitee Release
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Gitee Release (idempotent)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GITEE_REPO: ${{ github.repository }}  # gitee 侧假定同名仓（双远端规矩）
          COMMIT: ${{ github.sha }}
          # v1.7.12（第 6 轮审计 I-4）：prepare 已生成过 CHANGELOG 段/兜底
          # 正文——直传复用，不再两处独立解析（漂移源 + 缺段崩 job）
          PREPARED: ${{ needs.prepare.outputs.changelog }}
        run: |
          set -eu
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error title=GITEE_TOKEN 未配置::仓库 Settings→Secrets→Actions 添加 GITEE_TOKEN（纯 ASCII，勿带 BOM）"
            exit 1
          fi
          case "$GITEE_TOKEN" in
            *[![:print:]]*|$'\xef'*) echo "::error title=GITEE_TOKEN 含异常字节::疑似复制进 BOM/换行，重新设置纯 token"; exit 1;;
          esac
          python3 - <<'PY'
          import io, json, os, sys, urllib.request
          ver, sha = os.environ["VERSION"], os.environ["COMMIT"]
          tok = os.environ["GITEE_TOKEN"].strip()
          if not tok.isascii():
              print("::error title=GITEE_TOKEN 非 ASCII::含 BOM 或不可见字符"); sys.exit(1)
          api = "https://gitee.com/api/v5/repos/" + os.environ["GITEE_REPO"]
          def call(url, data=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode() if data else None,
                  method="POST" if data else "GET",
                  headers={"Content-Type": "application/json"} if data else {})
              return json.load(urllib.request.urlopen(req, timeout=30))
          existing = call(f"{api}/releases?access_token={tok}&per_page=100")
          if any(r.get("tag_name") == f"v{ver}" for r in existing):
              print(f"v{ver} Gitee Release 已存在，跳过（幂等）"); sys.exit(0)
          body = ""
          if os.path.exists("CHANGELOG.md"):
              log = io.open("CHANGELOG.md", encoding="utf-8").read()
              if f"## [{ver}]" in log:
                  i = log.index(f"## [{ver}]")
                  rest = log[i + 1:]
                  j = rest.index("## [", 3) if "## [" in rest[3:] else len(rest)
                  body = log[i:i + 1 + j].strip()
          if not body:
              # v1.7.12（审计 I-4）：缺段不再 ValueError 崩 job——优先复用
              # prepare 产物（含其 git-log 兜底），仍无则给最小说明
              body = (os.environ.get("PREPARED") or "").strip()
              if not body:
                  body = f"## v{ver}\n\n完整变更记录见 GitHub Release v{ver}。"
          body = body + "\n\n---\n完整记录见 GitHub 仓库 CHANGELOG.md 与 Release v%s。" % ver
          title_line = body.splitlines()[0]
          r = call(f"{api}/releases?access_token={tok}", {
              "tag_name": f"v{ver}", "name": f"v{ver}", "body": body,
              "target_commitish": sha, "prerelease": False})
          print(f"Gitee Release 已创建: id={r['id']} tag={r['tag_name']}")
          PY
